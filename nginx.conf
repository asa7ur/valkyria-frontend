# Ficheros con hash en el nombre (main-AB12CD34.js, media/...-AB12CD34.woff2): cambian de nombre en cada build,
# así que se pueden cachear para siempre. El resto (index.html, i18n, imágenes de public/) se revalida siempre
# para que tras un despliegue los usuarios reciban la versión nueva.
map $uri $valkyria_hashed_file {
    "~-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp)$"  1;
    default                                                             0;
}

# Solo las respuestas 200 se cachean para siempre (un 404 no)
map "$status:$valkyria_hashed_file" $valkyria_cache_control {
    "200:1"  "public, max-age=31536000, immutable";
    default  "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $valkyria_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Nadie puede meter la web en un iframe (clickjacking)
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # Un fichero que no existe (p. ej. un main-XXXX.js de un build anterior) da 404 en vez de devolver index.html
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # Rutas de Angular: todo lo demás carga la SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
