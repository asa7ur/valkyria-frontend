<section class="text-white pt-16 pb-6 md:pt-24 md:pb-8 px-4 md:px-6" [class.is-revealed]="revealed()">
  <div class="max-w-7xl mx-auto">
    <div class="flex items-center gap-4 mb-10 md:mb-16">
      <h2 class="text-[10px] md:text-sm uppercase tracking-[0.5em] text-gray-500 whitespace-nowrap">
        {{ 'home.social.follow_us' | translate }}
      </h2>
      <div class="h-px w-full bg-white/10"></div>
    </div>

    <ul class="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-12 md:gap-10 px-2 md:px-10">
      @for (shield of shields; track shield.name; let i = $index) {
        <li class="roll flex flex-col items-center text-center" [style.--i]="i">
          <div class="shield w-full max-w-[210px] aspect-square rounded-full"
               [class]="'paint--' + shield.paint">
            <div class="boss absolute top-1/2 left-1/2 w-[34%] aspect-square rounded-full flex items-center justify-center">
              <i [class]="shield.icon" class="text-2xl md:text-3xl lg:text-4xl text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]"></i>
            </div>
          </div>

          <p class="font-bebas mt-6 text-sm md:text-base uppercase tracking-[0.4em] text-white">
            {{ shield.name }}
          </p>
          <p class="font-bebas mt-1 text-[10px] md:text-xs uppercase tracking-[0.25em] text-red-500">
            {{ shield.handle }}
          </p>
        </li>
      }
    </ul>
  </div>
</section>
