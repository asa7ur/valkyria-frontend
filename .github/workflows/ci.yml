# Tests y build de producción del frontend en cada push y PR a develop/main.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'   # la misma que usa el Dockerfile de producción
          cache: npm

      # Sin ejecutar los scripts de instalación de las dependencias (un paquete comprometido no puede ejecutar nada)
      - run: npm ci --ignore-scripts

      - name: Tests
        run: npm test -- --watch=false

      - name: Build de producción
        run: npm run build
