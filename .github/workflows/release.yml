# Al crear un tag vX.Y.Z: construye la imagen Docker del frontend y la publica en GitHub (GHCR) como
# ghcr.io/asa7ur/valkyria-frontend:X.Y.Z. El despliegue lo lanza el workflow de release del backend.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write   # publicar la imagen en GHCR

jobs:
  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Comprobar que el tag coincide con la versión de package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión de package.json ($version)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64   # el VPS es x86
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
